# ============================================================================
# site.yaml — global site configuration
#
# Everything here is used by build.py. The `nav` list is the single source of
# truth for the site's navigation: add an entry here and it appears in the
# header of every page. No other file needs to change.
# ============================================================================

title: "Kenny Easwaran"
tagline: "Professor of Logic and Philosophy of Science, University of California, Irvine"
author: "Kenny Easwaran"
base_url: "https://www.kennyeaswaran.org"
email: "k.easwaran@uci.edu"
orcid: "0000-0002-2278-6257"

# Header navigation, in display order.
# `url` must match the page's output path (see build.py's URL rules).
nav:
  - title: "Home"
    url: "/"
  - title: "Publications"
    url: "/publications/"
  - title: "Teaching"
    url: "/teaching/"
  - title: "CV"
    url: "/cv/"

# Old Google Sites paths that should redirect to their new homes, so existing
# links and search-engine results keep working. Add to this list if you ever
# rename a page.
redirects:
  "/home": "/"
  "/research": "/publications/"

  # Course pages migrated from Google Sites, August 2026. The old paths are
  # what Google indexed and what any syllabus or email links to, so each one
  # keeps working. Add a pair here whenever a course page moves.
  "/teaching/2026-winter": "/teaching/2026W/"
  "/teaching/2026-winter/2026-ai-seminar": "/teaching/2026W/lps221/"
  "/teaching/2026-ai-seminar": "/teaching/2026W/lps221/"
  "/teaching/2025-fall": "/teaching/2025F/"
  "/teaching/2025-fall/lps-105a": "/teaching/2025F/lps105a/"
  "/teaching/2020-spring": "/teaching/2020S/"
  "/teaching/2020-spring/phil-351": "/teaching/2020S/phil351/"
